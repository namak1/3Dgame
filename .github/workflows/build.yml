name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format -- --check
      - name: Rebuild the playable page
        run: npm run build
      - name: Fail if the committed page is stale
        run: git diff --exit-code -- index.html
